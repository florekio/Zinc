[package]
name = "zinc"
version = "0.5.0"
edition = "2024"
description = "A JavaScript engine written in Rust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
indexmap = "2"
bitflags = "2"
regex = "1"
wasm-bindgen = "0.2"
mimalloc = { version = "0.1", default-features = false, optional = true }
unicode-id-start = "1.4.0"
fancy-regex = "0.18.0"
num-bigint = "0.4.6"
num-traits = "0.2.19"

[features]
fast-alloc = ["mimalloc"]

[[bin]]
name = "test262_runner"
path = "tools/test262_runner.rs"

[dev-dependencies]
pretty_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false
